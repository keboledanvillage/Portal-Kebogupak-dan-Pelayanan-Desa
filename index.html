        function PrintSuratModal({ surat, profilDesa, onClose, onUpdateNomorTanggal }) {
            const [paperSize, setPaperSize] = useState('a4');
            const [nomorSuratVal, setNomorSuratVal] = useState(surat.nomorSurat && surat.nomorSurat !== '-' ? surat.nomorSurat : `470/${Math.floor(Math.random() * 899) + 100}/VI/2026`);
            const [tanggalSuratVal, setTanggalSuratVal] = useState(surat.tanggal && surat.tanggal !== '' ? surat.tanggal : new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }));

            const handleSaveNumDate = () => {
                if (onUpdateNomorTanggal) {
                    onUpdateNomorTanggal(surat.id, nomorSuratVal, tanggalSuratVal);
                }
            };

            const exportToWord = () => {
                handleSaveNumDate();
                const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
                    "xmlns:w='urn:schemas-microsoft-com:office:word' " +
                    "xmlns='http://www.w3.org/TR/REC-html40'>" +
                    "<head><title>Surat Desa Keboledan</title><style>" +
                    "@page { size: " + (paperSize === 'a4' ? "21cm 29.7cm" : "21.5cm 33cm") + "; margin: 2cm; }" +
                    "body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; }" +
                    "table { width: 100%; border-collapse: collapse; }" +
                    "</style></head><body>";

                const element = document.getElementById("printable-surat-content");
                const html = header + element.innerHTML + "</body></html>";

                const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Surat_${surat.keteranganSurat.replace(/\s+/g, '_')}_${surat.nama.replace(/\s+/g, '_')}.doc`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

                                    KEBO GUPAK
                                </h1>
                                <p className="text-[10px] text-emerald-700 dark:text-emerald-400 font-bold uppercase tracking-widest">
                                    Desa Keboledan - Wanasari - Brebes
                                </p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2 sm:space-x-3">
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:scale-105 transition-all text-xs" title="Ganti Tema">
                                {darkMode ? '☀️' : '🌙'}
                            </button>

                            {viewMode === 'warga' ? (
                                <button onClick={() => {
                                    if (isAdminLoggedIn) {
                                        setViewMode('admin');
                                    } else {
                                        setShowAdminLoginModal(true);
                                    }
                                }} className="px-3.5 py-2.5 bg-amber-500 hover:bg-amber-600 text-amber-950 font-extrabold text-xs rounded-xl shadow transition-all flex items-center gap-1.5">
                                    <Icon name="lock" className="w-4 h-4" />
                                    <span>{isAdminLoggedIn ? 'Panel Admin 🛠️' : 'Login Admin 🔐'}</span>
                                </button>
                            ) : (
                                <button onClick={() => setViewMode('warga')} className="px-3.5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow transition-all flex items-center gap-1.5">
                                    <Icon name="home" className="w-4 h-4" />
                                    <span>Portal Warga 🌐</span>
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Main Content Router */}
                    {viewMode === 'warga' ? (
                        <PortalWargaView 
                            activeTab={activeTab} 
                            setActiveTab={setActiveTab} 
                            profilDesa={profilDesa}
                            pengumuman={pengumuman}
                            umkmList={umkmList}
                            setUmkmList={setUmkmList}
                            ppidList={ppidList}
                            galleryList={galleryList}
                            suratList={suratList}
                            setSuratList={setSuratList}
                            dialogList={dialogList}
                            setDialogList={setDialogList}
                            forumList={forumList}
                            setForumList={setForumList}
                            dataPenduduk={dataPenduduk}
                            setSelectedSuratForPrint={setSelectedSuratForPrint}
                            triggerToast={triggerToast}
                        />
                    ) : (
                        <AdminDesaView 
                            adminTab={adminTab}
                            setAdminTab={setAdminTab}
                            profilDesa={profilDesa}
                            setProfilDesa={setProfilDesa}
                            pengumuman={pengumuman}
                            setPengumuman={setPengumuman}
                            ppidList={ppidList}
                            setPpidList={setPpidList}
                            galleryList={galleryList}
                            setGalleryList={setGalleryList}
                            suratList={suratList}
                            setSuratList={setSuratList}
                            dialogList={dialogList}
                            setDialogList={setDialogList}
                            forumList={forumList}
                            setForumList={setForumList}
                            dataPenduduk={dataPenduduk}
                            setDataPenduduk={setDataPenduduk}
                            setIsAdminLoggedIn={setIsAdminLoggedIn}
                            setViewMode={setViewMode}
                            setSelectedSuratForPrint={setSelectedSuratForPrint}
                            triggerToast={triggerToast}
                        />
                    )}

                    {/* Modals */}
                    {showAdminLoginModal && (
                        <AdminLoginModal 
                            onClose={() => setShowAdminLoginModal(false)}
                            onSuccess={() => {
                                setIsAdminLoggedIn(true);
                                setShowAdminLoginModal(false);
                                setViewMode('admin');
                                triggerToast('Berhasil masuk sebagai Admin Desa Keboledan!');
                            }}
                            triggerToast={triggerToast}
                        />
                    )}

                    {selectedSuratForPrint && (
                        <PrintSuratModal 
                            surat={selectedSuratForPrint}
                            profilDesa={profilDesa}
                            onClose={() => setSelectedSuratForPrint(null)}
                            onUpdateNomorTanggal={(id, nomorBaru, tanggalBaru) => {
                                const updated = suratList.map(s => s.id === id ? { ...s, nomorSurat: nomorBaru, tanggal: tanggalBaru } : s);
                                setSuratList(updated);
                            }}
                        />
                    )}

                    {toastMessage && (
                        <Toast message={toastMessage} onClose={() => setToastMessage(null)} />
                    )}

                    {/* Footer */}
                    <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500 space-y-1">
                        <p className="font-bold text-slate-700 dark:text-slate-300">© 2026 Pemerintah Desa Keboledan, Kecamatan Wanasari, Kabupaten Brebes, Jawa Tengah.</p>
                        <p>Portal Warga & Layanan Surat Online Terpadu Kebo Gupak</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
